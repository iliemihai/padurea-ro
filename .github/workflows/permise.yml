name: Autorizații de tăiere

# Compară zonele de pe site cu autorizațiile din Inspectorul Pădurii (SUMAL 2.0) și publică docs/data/permise.json.
# Rularea zilnică face același lucru doar pentru zonele noi; aici se poate porni de mână, pentru tot ce a rămas
# necomparat (sau --full, pentru a reface totul), și rulează și singură o dată pe lună: comparația peste tot
# istoricul costă ore de cereri către Inspectorul Pădurii; zilnic se compară doar zonele noi (în daily.yml).
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Reface verdictele pentru toate zonele (altfel doar pe cele fără verdict)"
        type: boolean
        default: false
  schedule:
    - cron: "41 2 3 * *"   # pe 3 ale lunii, noaptea

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  permise:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data/sumal_cache.sqlite
          key: sumal-${{ github.run_id }}
          restore-keys: sumal-
      - name: Autorizațiile din Inspectorul Pădurii
        run: python -m pipeline.permise ${{ inputs.full && '--full' || '' }}
      - name: Zonele noastre în presă
        continue-on-error: true
        run: python -m pipeline.stiri
      - name: Cache-ul SUMAL, salvat și dacă pasul următor pică
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sumal_cache.sqlite
          key: sumal-${{ github.run_id }}
      - name: Salvez în repo
        run: |
          git config user.name "padurea-ro bot"
          git config user.email "actions@users.noreply.github.com"
          # fișierele generate sunt ale rulării: le punem peste ce e acum pe main, fără rebase (conflictele pe JSON nu se rezolvă)
          mkdir -p /tmp/gen && for f in permise.json stiri.json parcele.json; do [ -f docs/data/$f ] && cp docs/data/$f /tmp/gen/; done
          git fetch origin main && git reset --hard origin/main
          cp /tmp/gen/* docs/data/
          # stările depind și de judecata cu context de pe main: le recalculăm peste ea, apoi paginile județelor
          python -m pipeline.permise --retime || true
          python -m pipeline.judete || true
          git add -A docs/data/permise.json docs/data/stiri.json docs/data/parcele.json docs/judet docs/data/rosii.json
          git commit -m "Autorizații: $(date -u +%Y-%m-%d)" || echo "nimic nou"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
