name: Rulare zilnică

on:
  schedule:
    - cron: "23 6 * * *"   # în fiecare zi, dimineața (ora României)
  workflow_dispatch:
    inputs:
      days:
        description: "Câte zile în urmă căutăm schimbări"
        default: "30"
      end:
        description: "Până la ce dată (AAAA-LL-ZZ), gol = azi"
        default: ""
      tiles:
        description: "Doar aceste plăci (pentru teste), gol = toate"
        default: ""
      judge:
        description: "Pornește judecătorul AI"
        default: "true"
      publish:
        description: "Publică pe site"
        default: "true"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  LOCAL_MODEL: qwen3.5:4b
  JUDGE_MAX_PER_GROUP: "60"
  PYTHONUNBUFFERED: "1"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/hansen
          key: hansen-gfc-2025
      - name: Modelul AI local
        if: (inputs.judge || 'true') == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "Folosim Claude, fără model local"; exit 0; fi
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p ~/.ollama/models
          (OLLAMA_MODELS=$HOME/.ollama/models OLLAMA_NUM_PARALLEL=1 ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          OLLAMA_MODELS=$HOME/.ollama/models ollama pull "$LOCAL_MODEL"
      - name: Detectorul
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pipeline.run_tiles --group ${{ matrix.group }} --groups 8 \
            --days "${{ inputs.days || '30' }}" --end "${{ inputs.end }}" --tiles "${{ inputs.tiles }}" \
            $([ "${{ inputs.judge || 'true' }}" = "true" ] && echo --judge)
      - uses: actions/upload-artifact@v4
        with:
          name: group-${{ matrix.group }}
          path: out/
          retention-days: 14

  finish:
    needs: detect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/hansen
          key: hansen-gfc-2025
      - uses: actions/download-artifact@v4
        with:
          pattern: group-*
          path: out
          merge-multiple: true
      - name: Agenții și publicarea
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m pipeline.run_finish
      - uses: actions/upload-artifact@v4
        with:
          name: rezultat
          path: |
            docs/data/
            out/group_*.json
          retention-days: 14
      - name: Salvez în repo
        if: (inputs.publish || 'true') == 'true'
        run: |
          git config user.name "padurea-ro bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data docs/img data/neconfirmate.json
          git commit -m "Date noi: $(date -u +%Y-%m-%d)" || echo "nimic nou"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/configure-pages@v5
        if: (inputs.publish || 'true') == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: (inputs.publish || 'true') == 'true'
        with:
          path: docs
      - id: deploy
        if: (inputs.publish || 'true') == 'true'
        uses: actions/deploy-pages@v4
