name: Arii protejate

# Ia limitele ariilor protejate (Natura 2000 și ariile naționale) de la Agenția Europeană de Mediu și le salvează în repo.
# Se pornește de mână, când apare o versiune nouă a datelor (EEA le actualizează o dată pe an).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  arii:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyogrio
      - name: Ariile protejate de la EEA
        run: python -m pipeline.static_arii
      - name: Zonele de pe site primesc ariile în care cad
        run: python -m pipeline.arii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arii
          path: |
            out/arii_raport.json
            data/arii_ro.geojson
            docs/data/static/arii.geojson
          retention-days: 14
      - name: Salvez în repo
        run: |
          git config user.name "padurea-ro bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/arii_ro.geojson docs/data/static/arii.geojson docs/data/alerts.json
          git commit -m "Ariile protejate (EEA): $(date -u +%Y-%m-%d)" || echo "nimic nou"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
