name: Judecata cu context

# AI-ul rejudecă zonele roșii/nejudecate/probabile cu poza Esri, perechea Sentinel, vederea largă și fișa de context.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Reface și zonele deja judecate"
        type: boolean
        default: false
      martori:
        description: "Și un eșantion de zone verzi (martor pentru evaluare)"
        type: boolean
        default: false
      limit:
        description: "Doar primele N zone (probă); gol = toate"
        type: string
        default: ""
      ids:
        description: "Doar aceste zone (ID-uri despărțite prin spațiu)"
        type: string
        default: ""
      model:
        description: "Modelul (gol = cel din config)"
        type: string
        default: ""
      out:
        description: "Fișier de ieșire (gol = docs/data/judecata.json)"
        type: string
        default: ""
      refa:
        description: "Rejudecă tot ce a fost judecat cu alt model (se poate relua)"
        type: boolean
        default: false
  schedule:
    - cron: "23 3 4 * *"   # pe 4 ale lunii, după autorizațiile din 3: peisajul și judecata zonelor noi din lună

permissions:
  contents: write

# rulările care scriu în fișiere diferite (probele de evaluare) pot merge în paralel cu cea principală
concurrency:
  group: judecata-${{ inputs.out || 'principal' }}
  cancel-in-progress: false

jobs:
  judecata:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/hansen
          key: hansen-gfc-2025
      - name: Peisajul zonelor noi (înaintea judecății, care îl folosește)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: python -m pipeline.peisaj
      - name: Judecata
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.rejudeca ${{ inputs.full && '--full' || '' }} ${{ inputs.martori && '--si-martori' || '' }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} ${{ inputs.ids && format('--ids {0}', inputs.ids) || '' }} ${{ inputs.model && format('--model {0}', inputs.model) || '' }} ${{ inputs.out && format('--out {0}', inputs.out) || '' }} ${{ inputs.refa && '--refa-alt-model' || '' }}
      - name: Salvez în repo
        if: always()
        run: |
          git config user.name "padurea-ro bot"
          git config user.email "actions@users.noreply.github.com"
          OUT="${{ inputs.out }}"; OUT="${OUT:-docs/data/judecata.json}"
          [ -f "$OUT" ] || exit 0
          cp "$OUT" /tmp/judecata.json
          cp docs/data/peisaj.json /tmp/peisaj.json
          git fetch origin main && git reset --hard origin/main
          cp /tmp/judecata.json "$OUT"
          git add "$OUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then cp /tmp/peisaj.json docs/data/peisaj.json && git add docs/data/peisaj.json; fi
          # judecata principală schimbă stările de pe hartă: le recalculăm aici, ca să nu aștepte rularea zilnică
          if [ "$OUT" = "docs/data/judecata.json" ]; then
            python -m pipeline.permise --retime && git add docs/data/permise.json
            python -m pipeline.judete && git add -A docs/judet docs/data/rosii.json
          fi
          git commit -m "Judecata: $(date -u +%Y-%m-%d)" || echo "nimic nou"
          git push origin HEAD:main
